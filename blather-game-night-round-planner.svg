<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">How many turns are in your game night?</title>
<desc id="desc">A Blather planning matrix for two to six players and one to five rounds. Every player describes once per round, so total describing turns equal players times rounds. Counts are calculated from rules, not measured duration or player statistics.</desc>
<rect width="1200" height="1500" fill="#F4F0E7"/>
<rect x="44" y="44" width="1112" height="1412" rx="36" fill="#FFFDF7" stroke="#243A35" stroke-width="3"/>
<text x="90" y="110" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243A35" text-anchor="start">BLATHER  /  GAME NIGHT FIELD GUIDE</text>
<rect x="90" y="142" width="76" height="8" rx="4" fill="#F08454"/>
<text x="90" y="222" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="#243A35" text-anchor="start">How many turns</text>
<text x="90" y="298" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="#243A35" text-anchor="start">are in your game night?</text>
<text x="90" y="352" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#243A35" text-anchor="start">Choose the group. Choose the rounds. See the commitment.</text>
<text x="90" y="414" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#243A35" text-anchor="start">1 player describes once per round</text>
<text x="90" y="455" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#243A35" text-anchor="start">TOTAL DESCRIBING TURNS = PLAYERS × ROUNDS</text>
<text x="400" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#243A35" text-anchor="start">ROUNDS</text>
